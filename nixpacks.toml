[phases.setup]
aptPkgs = ["libnss3", "libatk-bridge2.0-0", "libdrm2", "libxkbcommon0", "libgbm1", "libpango-1.0-0", "libcairo2", "libasound2", "libxshmfence1", "libx11-xcb1", "libxcomposite1", "libxdamage1", "libxrandr2", "libatspi2.0-0", "libcups2", "libxfixes3", "libdbus-1-3", "libexpat1", "libxcb1", "libxext6", "libx11-6", "fonts-liberation"]

[phases.build]
cmds = ["npm install", "cd dashboard && npm install && npx vite build", "npx playwright install chromium"]

[start]
cmd = "node server.js"
